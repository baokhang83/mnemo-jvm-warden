{{- $boost := .Values.boost | default dict }}
{{- $observability := $boost.observability | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-controller
  labels:
    {{- include "warden.labels" . | nindent 4 }}
spec:
  # Hardcoded, not a value: WardenPolicyReconciler has no leader election configured, so a
  # second replica would double-reconcile every WardenPolicy independently (duplicate intent
  # PATCHes, duplicate status writes) instead of standing by - there's no safe "just scale it up"
  # yet, so this isn't exposed as a knob a values.yaml edit could quietly break.
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "warden.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "warden.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "warden.controller.serviceAccountName" . }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: WARDEN_CONTROLLER_DEPLOYMENT
              value: {{ include "warden.fullname" . }}-controller
            - name: WARDEN_CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $observability.enabled }}
            - name: WARDEN_BOOST_OBSERVABILITY_ENABLED
              value: "true"
            - name: WARDEN_BOOST_EVENTS_ENABLED
              value: "true"
            - name: WARDEN_BOOST_METRICS_PORT
              value: {{ $observability.port | default 8081 | quote }}
            {{- end }}
            {{- if .Values.controller.prometheusUrl }}
            - name: WARDEN_PROMETHEUS_URL
              value: {{ .Values.controller.prometheusUrl | quote }}
            {{- end }}
          {{- if $observability.enabled }}
          ports:
            - name: boost-metrics
              containerPort: {{ $observability.port | default 8081 }}
          {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
