name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (JDK 21)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed chart versions
        if: github.event_name == 'pull_request'
        env:
          CHART_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: deploy/check-chart-versions.sh "$CHART_BASE_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Check charts/warden/crds is in sync with the generated CRD
        run: |
          for resource in wardenpolicy wardenboost; do
            if [ "$resource" = wardenpolicy ]; then plural=wardenpolicies; else plural=wardenboosts; fi
            diff -u "charts/warden/crds/${resource}-crd.yaml" \
                    "warden-crd-model/target/classes/META-INF/fabric8/${plural}.warden.mnemo.io-v1.yml" || {
              echo "::error::${resource} CRD is stale; regenerate with mvn -pl warden-crd-model process-classes and copy into charts/warden/crds."
              exit 1
            }
          done

      - name: Generate JaCoCo badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: coverage/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: coverage/target/site/jacoco-aggregate/badges

      # Assemble the Pages site. Runs on pull requests too (nothing is deployed), so a broken layout fails review, not main.
      # gh-pages also serves the Helm repository (index.yaml, charts/*.tgz, artifacthub-repo.yml): kept out of the clean-up below.
      - name: Assemble the GitHub Pages site
        run: |
          report=coverage/target/site/jacoco-aggregate
          out=pages-site
          rm -rf "$out"
          mkdir -p "$out/coverage"
          # Docs site (landing page, subpages, sitemap, robots) at the root.
          cp -R site/. "$out/"
          cp llms.txt "$out/llms.txt"
          cp artifacthub-repo.yml "$out/artifacthub-repo.yml"
          # The JaCoCo report moves under /coverage/ whole (it uses relative links).
          cp -R "$report/." "$out/coverage/"
          # The README coverage badge reads badges/jacoco.svg from the gh-pages branch root: keep it there.
          rm -rf "$out/coverage/badges"
          cp -R "$report/badges" "$out/badges"
          test -s "$out/badges/jacoco.svg"
          test -f "$out/index.html" && test -f "$out/coverage/index.html"
          # Ownership verification tags and crawler files must survive any edit of the site.
          grep -q 'name="google-site-verification" content="Q7SKsA-JukICYFV0a1XTQDHq_ZciLmj43Pjui4xJ_9Y"' "$out/index.html"
          grep -q 'name="msvalidate.01" content="F8E60EFE3EC283577A2A0DADE4A5D82E"' "$out/index.html"
          grep -q 'href="llms.txt">llms.txt</a>' "$out/index.html"
          grep -q '/llms.txt</loc>' "$out/sitemap.xml"
          # Helm repository files are owned by the chart-publishing workflows, never by this step.
          test ! -e "$out/index.yaml" && test ! -e "$out/charts"

      - name: Publish coverage report to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pages-site
          clean-exclude: |
              index.yaml
              artifacthub-repo.yml
              charts/**
