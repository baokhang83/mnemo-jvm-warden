name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (JDK 21)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Check charts/warden/crds is in sync with the generated CRD
        run: |
          for resource in wardenpolicy wardenboost; do
            if [ "$resource" = wardenpolicy ]; then plural=wardenpolicies; else plural=wardenboosts; fi
            diff -u "charts/warden/crds/${resource}-crd.yaml" \
                    "warden-crd-model/target/classes/META-INF/fabric8/${plural}.warden.mnemo.io-v1.yml" || {
              echo "::error::${resource} CRD is stale; regenerate with mvn -pl warden-crd-model process-classes and copy into charts/warden/crds."
              exit 1
            }
          done

      - name: Generate JaCoCo badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: coverage/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: coverage/target/site/jacoco-aggregate/badges

      - name: Publish coverage report to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: coverage/target/site/jacoco-aggregate
          clean-exclude: |
              index.yaml
